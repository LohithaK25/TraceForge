spring.application.name=inventory-service
server.port=${SERVER_PORT:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.datasource.url=${TRACEFORGE_DATABASE_URL:jdbc:postgresql://postgres:5432/traceforge?currentSchema=inventory_service}
spring.datasource.username=${POSTGRES_USER:traceforge}
spring.datasource.password=${POSTGRES_PASSWORD:traceforge-local-only}
spring.flyway.schemas=inventory_service
spring.flyway.default-schema=inventory_service
spring.flyway.create-schemas=true
traceforge.inventory.demo-sku=${TRACEFORGE_INVENTORY_DEMO_SKU:SKU-ALPHA}
traceforge.inventory.demo-quantity=${TRACEFORGE_INVENTORY_DEMO_QUANTITY:12}
