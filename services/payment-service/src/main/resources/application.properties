spring.application.name=payment-service
server.port=${SERVER_PORT:8083}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.datasource.url=${TRACEFORGE_DATABASE_URL:jdbc:postgresql://postgres:5432/traceforge?currentSchema=payment_service}
spring.datasource.username=${POSTGRES_USER:traceforge}
spring.datasource.password=${POSTGRES_PASSWORD:traceforge-local-only}
spring.flyway.schemas=payment_service
spring.flyway.default-schema=payment_service
spring.flyway.create-schemas=true
