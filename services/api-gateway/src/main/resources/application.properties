spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
traceforge.inventory.base-url=${INVENTORY_SERVICE_URL:http://localhost:8081}
traceforge.inventory.connect-timeout=1s
traceforge.inventory.read-timeout=2s
traceforge.order.base-url=${ORDER_SERVICE_URL:http://localhost:8082}
traceforge.order.connect-timeout=1s
traceforge.order.read-timeout=4s
traceforge.investigation.base-url=${INVESTIGATION_SERVICE_URL:http://localhost:8090}
traceforge.investigation.connect-timeout=1s
traceforge.investigation.read-timeout=10s
traceforge.tempo.base-url=${TEMPO_BASE_URL:http://localhost:3200}
traceforge.tempo.connect-timeout=1s
traceforge.tempo.read-timeout=3s
