spring.application.name=order-service
server.port=${SERVER_PORT:8082}
server.error.include-path=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.datasource.url=${TRACEFORGE_DATABASE_URL:jdbc:postgresql://postgres:5432/traceforge?currentSchema=order_service}
spring.datasource.username=${POSTGRES_USER:traceforge}
spring.datasource.password=${POSTGRES_PASSWORD:traceforge-local-only}
spring.flyway.schemas=order_service
spring.flyway.default-schema=order_service
spring.flyway.create-schemas=true
traceforge.inventory.base-url=${INVENTORY_SERVICE_URL:http://inventory-service:8081}
traceforge.inventory.connect-timeout=1s
traceforge.inventory.read-timeout=2s
traceforge.payment.base-url=${PAYMENT_SERVICE_URL:http://payment-service:8083}
traceforge.payment.connect-timeout=1s
traceforge.payment.read-timeout=2s
traceforge.recovery.enabled=${TRACEFORGE_RECOVERY_ENABLED:true}
traceforge.recovery.fixed-delay=${TRACEFORGE_RECOVERY_FIXED_DELAY:5000}
